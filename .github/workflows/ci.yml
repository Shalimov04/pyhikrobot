name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests/unit -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  package:
    # The src/ layout exists to stop the working tree masking a packaging bug, which only
    # pays off if something actually installs the built artifact and imports it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/check/bin/python -c "
          import pathlib
          import hikrobot, hikrobot._loader as loader
          assert 'site-packages' in hikrobot.__file__, hikrobot.__file__
          assert loader._library is None, 'the SDK was loaded at import time'
          assert (pathlib.Path(hikrobot.__file__).parent / 'py.typed').is_file()
          print(hikrobot.__version__, len(hikrobot.__all__), 'public names')
          "
